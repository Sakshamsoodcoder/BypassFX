<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bypass-FX logo">
  <defs>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F5138"/>
      <stop offset="1" stop-color="#0B3B2A"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="12" y1="46" x2="46" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8FBF1"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#badgeGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="18" fill="none" stroke="#1E7A56" stroke-width="1"/>

  <!-- bypass route: detours around the node instead of a straight line -->
  <path d="M14 46 C14 46 14 34 22 34 C26 34 26 34 26 34 C30 34 30 22 38 22 L44 22"
        fill="none" stroke="url(#lineGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead -->
  <path d="M39 16 L46 22 L39 28" fill="none" stroke="url(#lineGrad)" stroke-width="4.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the node being bypassed -->
  <circle cx="26" cy="34" r="3.4" fill="#0B3B2A" stroke="#E8FBF1" stroke-width="2"/>

  <!-- tiny FX rate bars, bottom-right -->
  <rect x="47" y="42" width="2.6" height="8" rx="1.3" fill="#6EE7B7" opacity="0.9"/>
  <rect x="51.4" y="37" width="2.6" height="13" rx="1.3" fill="#A7F3D3" opacity="0.95"/>
  <rect x="55.8" y="45" width="2.6" height="5" rx="1.3" fill="#6EE7B7" opacity="0.75"/>
</svg>
