<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converter · Bypass-FX</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<script>
  // Early guard — runs before the page paints, so a logged-out visitor
  // never sees the converter even for a frame. The logoutBtn block in
  // js/auth.js still runs after this and populates the greeting; this
  // is just the part that has to run first.
  (function () {
    try {
      var hasSession = !!(localStorage.getItem('bypassfx_session') || sessionStorage.getItem('bypassfx_session'));
      if (!hasSession) window.location.replace('login.html');
    } catch (err) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="dash-shell">
  <div class="dash-top">
    <div class="brand-mark">
      <img src="assets/logo.svg" alt="">
      <span>Bypass-FX</span>
    </div>
    <button class="btn-ghost" id="logoutBtn">Log out</button>
  </div>

  <div class="dash-card">
    <h2 id="greeting">Welcome back</h2>
    <p>Compare direct and multi-hop conversion paths across providers.</p>

    <form id="convertForm" class="converter-form">
      <div class="converter-grid">
        <div class="field">
          <label for="fromCurrency">From</label>
          <div class="field-input">
            <select id="fromCurrency"></select>
          </div>
        </div>
        <div class="field">
          <label for="toCurrency">To</label>
          <div class="field-input">
            <select id="toCurrency"></select>
          </div>
        </div>
        <div class="field">
          <label for="amount">Amount</label>
          <div class="field-input">
            <input type="number" id="amount" min="0" step="0.01" value="1000" required>
          </div>
        </div>
        <div class="field">
          <label for="maxHops">Max hops</label>
          <div class="field-input">
            <select id="maxHops">
              <option value="1">1 (direct only)</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
            </select>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-primary">Find cheapest path</button>
    </form>

    <div id="convertResult" class="convert-result"></div>
  </div>

  <div class="dash-card history-card">
    <h2>Recent conversions</h2>
    <p>Saved to your account via json-server.</p>
    <div id="history-list"></div>
  </div>
</main>

<script src="js/auth.js"></script>
<script type="module" src="js/converter.js"></script>
</body>
</html>
